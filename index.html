<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5B6CFF">
<title>记账本</title>
<style>
:root{
  --brand:#5B6CFF; --brand-2:#8B5CF6; --income:#10B981; --expense:#F43F5E;
  --bg:#F5F6FB; --card:#FFFFFF; --text:#111827; --muted:#6B7280;
  --line:#EDEFF5; --shadow:0 4px 16px rgba(24,32,72,.07);
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  overscroll-behavior-y:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
.hide{display:none!important}

/* ---------- 锁屏 ---------- */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#5B6CFF 0%,#8B5CF6 55%,#EC4899 100%);z-index:100;padding:24px}
.lockbox{width:100%;max-width:340px;background:#fff;border-radius:22px;padding:28px 22px;
  box-shadow:0 18px 50px rgba(24,20,80,.28);text-align:center}
.lockbox .logo{font-size:40px;margin-bottom:6px}
.lockbox h1{font-size:20px;margin:0 0 4px}
.lockbox p{color:var(--muted);font-size:13px;margin:0 0 20px}
.lockbox input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
  background:#FAFBFF;outline:none;margin-bottom:12px;text-align:center;letter-spacing:1px}
.lockbox input:focus{border-color:var(--brand);background:#fff}
.btn-primary{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;font-weight:600;font-size:15px}
.btn-primary:active{opacity:.85}
.lockerr{color:var(--expense);font-size:13px;min-height:18px;margin-bottom:6px}
.locktip{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.6}

/* ---------- 布局 ---------- */
#app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto;background:var(--bg)}
header{position:sticky;top:0;z-index:20;background:rgba(245,246,251,.92);backdrop-filter:blur(12px);
  padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h2{margin:0;font-size:17px;flex:1}
.iconbtn{width:34px;height:34px;border-radius:10px;background:#fff;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:16px}
main{flex:1;overflow-y:auto;padding:14px 14px 96px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:820px;margin:0 auto;background:#fff;
  border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;
  color:var(--muted);font-size:11px;border-radius:12px}
nav button .ni{font-size:19px;line-height:1}
nav button.on{color:var(--brand);font-weight:600}
nav button.on .ni{transform:translateY(-1px)}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#5B6CFF,#8B5CF6 60%,#A855F7);color:#fff;border-radius:20px;
  padding:18px 18px 16px;margin-bottom:12px;box-shadow:0 10px 30px rgba(91,108,255,.28)}
.hero .lab{font-size:12px;opacity:.85}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:2px 0 12px}
.hero .row{display:flex;gap:18px}
.hero .row div{flex:1}
.hero .row .k{font-size:11px;opacity:.8}
.hero .row .v{font-size:16px;font-weight:600;margin-top:2px}

.sec-title{font-size:13px;color:var(--muted);margin:16px 4px 8px;display:flex;justify-content:space-between}
.income{color:var(--income)} .expense{color:var(--expense)}

/* 列表行 */
.rowitem{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)}
.rowitem:last-child{border-bottom:none}
.ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:18px;background:#F1F3FF;flex-shrink:0}
.ic.g{background:#E9F9F2} .ic.r{background:#FFEEF2}
.rowitem .main{flex:1;min-width:0}
.rowitem .t1{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .t2{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .amt{font-weight:600;font-size:15px;white-space:nowrap}

/* 记一笔 */
.seg{display:flex;background:#EEF0F8;border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 2px 8px rgba(24,32,72,.08)}
.amtbox{text-align:center;padding:8px 0 14px}
.amtbox .cur{font-size:20px;color:var(--muted);vertical-align:6px}
.amtbox input{width:70%;border:none;outline:none;background:transparent;font-size:40px;font-weight:700;
  text-align:center;letter-spacing:-1px}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;
  font-size:11px;color:var(--muted)}
.cats button .em{font-size:21px;line-height:1}
.cats button.on{background:#EEF1FF;color:var(--brand);font-weight:600}
.field{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:none}
.field label{width:62px;color:var(--muted);font-size:13px;flex-shrink:0}
.field select,.field input[type=text],.field input[type=date]{
  flex:1;border:none;outline:none;background:transparent;text-align:right;font-size:14px}
.field select{appearance:none;-webkit-appearance:none}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick button{padding:6px 12px;border-radius:20px;background:#F1F3FF;color:var(--brand);font-size:13px}

/* 账户卡 */
.acct{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.acct:last-child{border-bottom:none}
.acct .nm{flex:1}
.acct .nm .a{font-size:14px;font-weight:500}
.acct .nm .b{font-size:12px;color:var(--muted)}
.acct .bal{font-weight:600}
.neg{color:var(--expense)}

/* 统计 */
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips button{padding:7px 16px;border-radius:20px;background:#fff;box-shadow:var(--shadow);font-size:13px;color:var(--muted)}
.chips button.on{background:var(--brand);color:#fff;font-weight:600}
.donutwrap{display:flex;align-items:center;gap:16px}
.donut{width:132px;height:132px;flex-shrink:0}
.legend{flex:1;min-width:0}
.legend .lg{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.legend .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.legend .pct{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:8px;border-bottom:1px solid var(--line)}
.bars .b{flex:1;background:linear-gradient(180deg,#A5B4FC,#5B6CFF);border-radius:4px 4px 0 0;min-height:0;
  position:relative;transition:height .3s}
.bars .b span{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statgrid .box{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.statgrid .box .k{font-size:12px;color:var(--muted)}
.statgrid .box .v{font-size:19px;font-weight:700;margin-top:2px}

/* 设置 */
.setitem{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14px}
.setitem:last-child{border-bottom:none}
.setitem .r{margin-left:auto;color:var(--muted);font-size:13px}
.inp{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#FAFBFF;outline:none;margin-top:8px}
.inp:focus{border-color:var(--brand);background:#fff}
.btn{padding:11px 16px;border-radius:11px;background:#EEF1FF;color:var(--brand);font-weight:600;font-size:14px}
.btn.warn{background:#FFEEF2;color:var(--expense)}
.btn.ghost{background:#F3F4F8;color:var(--text)}
.help{font-size:12px;color:var(--muted);line-height:1.7;margin-top:8px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;
  padding:10px 18px;border-radius:22px;font-size:13.5px;z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:150;display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{width:100%;max-width:820px;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:16px}
@media(min-width:760px){
  body{background:#EEF0F8}
  #app{box-shadow:0 0 40px rgba(24,32,72,.10);min-height:100vh}
  .cats{grid-template-columns:repeat(8,1fr)}
}
</style>
</head>
<body>

<!-- 锁屏 -->
<div id="lock">
  <div class="lockbox">
    <div class="logo">🔐</div>
    <h1 id="lockTitle">记账本</h1>
    <p id="lockSub">输入密码解锁</p>
    <input id="pw" type="password" inputmode="text" placeholder="密码" autocomplete="current-password">
    <input id="pw2" type="password" inputmode="text" placeholder="再输入一次" class="hide" autocomplete="new-password">
    <div class="lockerr" id="lockErr"></div>
    <button class="btn-primary" id="lockBtn">解锁</button>
    <div class="locktip" id="lockTip">密码同时用于加密数据，忘了无法找回</div>
    <div class="locktip" id="restoreLink" style="display:none">
      换手机？<span style="color:#5B6CFF;text-decoration:underline;cursor:pointer">从云端恢复数据</span>
    </div>
  </div>
</div>

<!-- 主界面 -->
<div id="app" class="hide">
  <header>
    <h2 id="pageTitle">总览</h2>
    <button class="iconbtn" id="btnSync" title="同步">☁️</button>
    <button class="iconbtn" id="btnLock" title="锁定">🔒</button>
  </header>
  <main id="main"></main>
  <nav id="nav">
    <button data-v="home" class="on"><span class="ni">🏠</span>总览</button>
    <button data-v="record"><span class="ni">➕</span>记一笔</button>
    <button data-v="list"><span class="ni">📋</span>流水</button>
    <button data-v="stats"><span class="ni">📊</span>统计</button>
    <button data-v="accounts"><span class="ni">💳</span>账户</button>
    <button data-v="settings"><span class="ni">⚙️</span>设置</button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<div id="sheetHost"></div>

<script>
"use strict";
/* ============================================================
   0. 工具
============================================================ */
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
const fmt = n => (Math.round((+n||0)*100)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0 = n => Math.round(+n||0).toLocaleString('zh-CN');
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1800); }
function b64(buf){ let s=''; const b=new Uint8Array(buf); for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function unb64(str){ const bin=atob(str); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b; }

/* ============================================================
   1. 加密
============================================================ */
const PBKDF2_ITER = 180000;
async function deriveKey(pw, salt){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:PBKDF2_ITER, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function seal(db, pw){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key,
    new TextEncoder().encode(JSON.stringify(db)));
  return {v:1, salt:b64(salt), iv:b64(iv), ct:b64(new Uint8Array(ct)), ts:Date.now()};
}
async function openSeal(vault, pw){
  const key = await deriveKey(pw, unb64(vault.salt));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(vault.iv)}, key, unb64(vault.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ============================================================
   2. 存储
============================================================ */
const K_VAULT='jz.vault', K_CFG='jz.cfg';
const Store = {
  getCfg(){ try{ return JSON.parse(localStorage.getItem(K_CFG)||'{}'); }catch(e){ return {}; } },
  setCfg(c){ localStorage.setItem(K_CFG, JSON.stringify(c)); },
  getVault(){ try{ return JSON.parse(localStorage.getItem(K_VAULT)||'null'); }catch(e){ return null; } },
  setVault(v){ localStorage.setItem(K_VAULT, JSON.stringify(v)); },
};

/* ============================================================
   3. 默认数据
============================================================ */
const CAT_EXPENSE = [
  ['餐饮','🍜'],['买菜','🥬'],['外卖','🛵'],['零食','🍬'],
  ['交通','🚌'],['打车','🚕'],['加油','⛽'],['停车','🅿️'],
  ['购物','🛍️'],['服饰','👕'],['数码','📱'],['日用','🧴'],
  ['房租','🏠'],['水电','💡'],['燃气','🔥'],['物业','🏢'],
  ['通讯','📶'],['宽带','🌐'],['娱乐','🎮'],['旅游','✈️'],
  ['健身','🏋️'],['医疗','🏥'],['药品','💊'],['教育','📚'],
  ['人情','🎁'],['红包','🧧'],['宠物','🐱'],['美容','💅'],
  ['保险','🛡️'],['税费','🧾'],['还款','💳'],['其他','📦']
];
const CAT_INCOME = [
  ['工资','💰'],['奖金','🏆'],['兼职','💼'],['红包','🧧'],
  ['投资','📈'],['报销','🧾'],['退款','↩️'],['其他','➕']
];
function defaultDB(){
  return {
    v:1,
    accounts:[ {id:uid(), name:'现金', type:'cash', icon:'💵', balance:0},
               {id:uid(), name:'银行卡', type:'bank', icon:'🏦', balance:0},
               {id:uid(), name:'支付宝', type:'alipay', icon:'🔵', balance:0},
               {id:uid(), name:'微信', type:'wechat', icon:'🟢', balance:0} ],
    debts:[ {id:uid(), name:'花呗', type:'huabei', icon:'🌸', limit:0, balance:0, billDay:1, dueDay:9},
            {id:uid(), name:'京东白条', type:'baitiao', icon:'🛒', limit:0, balance:0, billDay:2, dueDay:10},
            {id:uid(), name:'信用卡', type:'credit', icon:'💳', limit:0, balance:0, billDay:5, dueDay:23},
            {id:uid(), name:'借呗', type:'jiebei', icon:'💰', limit:0, balance:0, billDay:1, dueDay:20} ],
    txs:[],
    receivables:[],
    cats:{ expense:CAT_EXPENSE.map(([n,e])=>({n,e})), income:CAT_INCOME.map(([n,e])=>({n,e})) },
    meta:{ created:Date.now() }
  };
}

/* ============================================================
   4. 全局状态
============================================================ */
const S = { db:null, pw:null, vault:null, view:'home', rec:{type:'expense',account:null,cat:null,date:today()}, stat:{range:'month',anchor:new Date()}, cfg:Store.getCfg() };

/* ============================================================
   5. 业务计算
============================================================ */
const Acc = {
  list(){ return S.db.accounts; },
  byId(id){ return S.db.accounts.find(a=>a.id===id) || S.db.debts.find(a=>a.id===id); },
  totalCash(){ return S.db.accounts.reduce((s,a)=>s+(+a.balance||0),0); },
  totalDebt(){ return S.db.debts.reduce((s,d)=>s+(+d.balance||0),0); },
  recvList(){ return S.db.receivables || []; },
  totalRecv(){ return Acc.recvList().reduce((s,r)=>s+(+r.amount||0),0); },
  net(){ return Acc.totalCash()+Acc.totalRecv()-Acc.totalDebt(); }
};

function addTx(tx){
  S.db.txs.push(tx);
  applyTx(tx, 1);
  save();
}
function applyTx(tx, sign){
  const amt = (+tx.amount||0) * sign;
  const getA = id => S.db.accounts.find(a=>a.id===id);
  const getD = id => S.db.debts.find(a=>a.id===id);
  if(tx.kind==='expense'){
    const a=getA(tx.account); if(a) a.balance = round2((+a.balance||0) - amt);
  } else if(tx.kind==='income'){
    const a=getA(tx.account); if(a) a.balance = round2((+a.balance||0) + amt);
  } else if(tx.kind==='transfer'){
    const f=getA(tx.account), t=getA(tx.to); 
    if(f) f.balance = round2((+f.balance||0) - amt);
    if(t) t.balance = round2((+t.balance||0) + amt);
  } else if(tx.kind==='debt_use'){          // 用信用卡/花呗消费：欠款增加
    const d=getD(tx.debt); if(d) d.balance = round2((+d.balance||0) + amt);
  } else if(tx.kind==='lend'){              // 借出：账户减少 + 应收增加
    const a=getA(tx.account);
    const r=(S.db.receivables||[]).find(x=>x.id===tx.recv);
    if(a) a.balance = round2((+a.balance||0) - amt);
    if(r) r.amount = round2((+r.amount||0) + amt);
  } else if(tx.kind==='advance'){           // 代付：负债增加 + 应收增加（不算支出）
    const d=getD(tx.debt);
    const r=(S.db.receivables||[]).find(x=>x.id===tx.recv);
    if(d) d.balance = round2((+d.balance||0) + amt);
    if(r) r.amount = round2((+r.amount||0) + amt);
  } else if(tx.kind==='collect'){           // 收回：账户增加 + 应收减少
    const a=getA(tx.account);
    const r=(S.db.receivables||[]).find(x=>x.id===tx.recv);
    if(a) a.balance = round2((+a.balance||0) + amt);
    if(r) r.amount = round2(Math.max(0,(+r.amount||0) - amt));
  } else if(tx.kind==='repay'){             // 还款：账户减少 + 欠款减少
    const a=getA(tx.account), d=getD(tx.debt);
    if(a) a.balance = round2((+a.balance||0) - amt);
    if(d) d.balance = round2(Math.max(0,(+d.balance||0) - amt));
  }
}
function delTx(id){
  const i = S.db.txs.findIndex(t=>t.id===id); if(i<0) return;
  const tx = S.db.txs[i];
  applyTx(tx, -1);
  S.db.txs.splice(i,1);
  save();
}
function round2(n){ return Math.round((+n||0)*100)/100; }

/* ============================================================
   6. 同步（GitHub Gist，加密后上传）
============================================================ */
const Gist = {
  api:'https://api.github.com/gists',
  hdr(){ return {'Authorization':'Bearer '+S.cfg.token, 'Accept':'application/vnd.github+json','Content-Type':'application/json'}; },
  async push(vault){
    if(!S.cfg.token) return false;
    const body = {description:'记账本 · 加密数据', public:false,
      files:{'wallet.json':{content:JSON.stringify(vault)}}};
    if(S.cfg.gistId){
      const r = await fetch(this.api+'/'+S.cfg.gistId, {method:'PATCH', headers:this.hdr(), body:JSON.stringify(body)});
      if(!r.ok) throw new Error('上传失败 '+r.status);
      return true;
    } else {
      const r = await fetch(this.api, {method:'POST', headers:this.hdr(), body:JSON.stringify(body)});
      if(!r.ok) throw new Error('创建失败 '+r.status);
      const j = await r.json();
      S.cfg.gistId = j.id; Store.setCfg(S.cfg);
      return true;
    }
  },
  async pull(){
    if(!S.cfg.token || !S.cfg.gistId) return null;
    const r = await fetch(this.api+'/'+S.cfg.gistId, {headers:this.hdr()});
    if(!r.ok) throw new Error('拉取失败 '+r.status);
    const j = await r.json();
    const f = j.files && j.files['wallet.json'];
    if(!f) return null;
    let content = f.content;
    if(f.truncated && f.raw_url){ content = await (await fetch(f.raw_url)).text(); }
    return JSON.parse(content);
  }
};

let syncTimer=null;
function scheduleSync(){
  if(!S.cfg.token) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async ()=>{
    try{ await Gist.push(Store.getVault()); toast('已同步到云端'); }
    catch(e){ toast('同步失败：'+e.message); }
  }, 1500);
}

async function save(){
  const vault = await seal(S.db, S.pw);
  S.vault = vault;
  Store.setVault(vault);
  scheduleSync();
}

const TITLES = {home:'总览', record:'记一笔', list:'流水', stats:'统计', accounts:'账户', settings:'设置'};

function catIcon(t){
  const list = S.db.cats[t.kind==='income'?'income':'expense'] || [];
  const c = list.find(x=>x.n===t.cat);
  return c ? c.e : (t.kind==='income'?'➕':'📦');
}
function txRow(t){
  const r = el('div','rowitem');
  let title='', sub='', amt='', cls='';
  const accName = (Acc.byId(t.account)||{}).name || '';
  if(t.kind==='expense'){ title=t.cat||'支出'; sub=(t.note||accName); amt='-'+fmt(t.amount); cls='expense'; }
  else if(t.kind==='income'){ title=t.cat||'收入'; sub=(t.note||accName); amt='+'+fmt(t.amount); cls='income'; }
  else if(t.kind==='transfer'){ title='转账'; sub=accName+' → '+((Acc.byId(t.to)||{}).name||''); amt=fmt(t.amount); }
  else if(t.kind==='debt_use'){ title=(Acc.byId(t.debt)||{}).name+' 消费'; sub=t.note||t.cat||''; amt='+'+fmt(t.amount); cls='expense'; }
  else if(t.kind==='repay'){ title='还款 · '+(Acc.byId(t.debt)||{}).name; sub='从 '+(accName||'账户'); amt='-'+fmt(t.amount); }
  else if(t.kind==='lend'){ title='借出 · '+((S.db.receivables||[]).find(x=>x.id===t.recv)||{}).name||'应收'; sub=(t.note||accName); amt='-'+fmt(t.amount); }
  else if(t.kind==='collect'){ title='收回 · '+((S.db.receivables||[]).find(x=>x.id===t.recv)||{}).name||'应收'; sub='到 '+(accName||'账户'); amt='+'+fmt(t.amount); cls='income'; }
  else if(t.kind==='advance'){ title='代付 · '+(((S.db.receivables||[]).find(x=>x.id===t.recv)||{}).name)||'应收'; sub=(Acc.byId(t.debt)||{}).name+'（不计支出）'; amt=fmt(t.amount); }
  const icoCls = t.kind==='income'?'ic g':(t.kind==='expense'||t.kind==='debt_use'?'ic r':'ic');
  const ico = t.kind==='transfer'?'🔁':(t.kind==='repay'?'💳':(t.kind==='lend'?'🤝':(t.kind==='collect'?'💰':(t.kind==='advance'?'🧾':catIcon(t)))));
  r.innerHTML = `<div class="${icoCls}">${ico}</div>
    <div class="main"><div class="t1">${esc(title)}</div><div class="t2">${esc(t.date)}${sub?' · '+esc(sub):''}</div></div>
    <div class="amt ${cls}">${amt}</div>`;
  r.onclick = ()=>showTxSheet(t);
  return r;
}

function showTxSheet(t){
  const box = el('div','sheet');
  const accName=(Acc.byId(t.account)||{}).name||'-';
  const debtName=(Acc.byId(t.debt)||{}).name||'';

    <h3>${esc(kindName)} · ¥${fmt(t.amount)}</h3>
    <div class="setitem"><span>日期</span><span class="r">${esc(t.date)}</span></div>
    ${t.cat?`<div class="setitem"><span>分类</span><span class="r">${esc(t.cat)}</span></div>`:''}
    ${t.kind==='repay'?`<div class="setitem"><span>还款账户</span><span class="r">${esc(accName)}</span></div>`:''}
    ${t.kind==='repay'?`<div class="setitem"><span>负债</span><span class="r">${esc(debtName)}</span></div>`:''}
    ${t.kind==='transfer'?`<div class="setitem"><span>转出</span><span class="r">${esc(accName)}</span></div><div class="setitem"><span>转入</span><span class="r">${esc((Acc.byId(t.to)||{}).name||'')}</span></div>`:''}
    ${t.note?`<div class="setitem"><span>备注</span><span class="r">${esc(t.note)}</span></div>`:''}

    go('home');

function viewStats(){
  const w = el('div');
  const chips = el('div','chips');
  [['day','按日'],['month','按月'],['year','按年']].forEach(([k,l])=>{
    const b=el('button', S.stat.range===k?'on':'', l);
    b.onclick=()=>{ S.stat.range=k; render(); };
    chips.appendChild(b);
  });
  w.appendChild(chips);

  const now = S.stat.anchor || new Date();
  const y = now.getFullYear(), m = now.getMonth()+1;

  // 周期切换（上一月/下一月、上一年/下一年）
  const unit = S.stat.range==='year' ? '年' : '月';
  const navRow = el('div','sec-title');
  navRow.style.alignItems='center';
  navRow.innerHTML = `<button class="btn ghost" id="pv" style="padding:4px 12px;font-size:13px">‹ 上一${unit}</button>
    <span style="font-weight:600;color:var(--text)">${S.stat.range==='year'? y+'年' : (y+'-'+String(m).padStart(2,'0'))}</span>
    <button class="btn ghost" id="nx" style="padding:4px 12px;font-size:13px">下一${unit} ›</button>`;
  w.appendChild(navRow);
  navRow.querySelector('#pv').onclick = ()=>{
    const a = new Date(S.stat.anchor||new Date());
    if(S.stat.range==='year') a.setFullYear(a.getFullYear()-1); else a.setMonth(a.getMonth()-1);
    S.stat.anchor=a; render();
  };
  navRow.querySelector('#nx').onclick = ()=>{
    const a = new Date(S.stat.anchor||new Date());
    if(S.stat.range==='year') a.setFullYear(a.getFullYear()+1); else a.setMonth(a.getMonth()+1);
    S.stat.anchor=a; render();
  };

  let filtered=[], label='';
  if(S.stat.range==='day'){ const d=today(); filtered=S.db.txs.filter(t=>t.date===d); label=d; }
  else if(S.stat.range==='month'){ const ym=`${y}-${String(m).padStart(2,'0')}`; filtered=S.db.txs.filter(t=>t.date.startsWith(ym)); label=ym; }
  else { filtered=S.db.txs.filter(t=>t.date.startsWith(String(y)+'-')); label=String(y)+'年'; }

  const expTx = filtered.filter(t=>t.kind==='expense'||t.kind==='debt_use');
  const exp = expTx.reduce((s,t)=>s+ +t.amount,0);
  const inc = filtered.filter(t=>t.kind==='income').reduce((s,t)=>s+ +t.amount,0);

  const grid = el('div','statgrid',`
    <div class="box"><div class="k">${esc(label)} 支出</div><div class="v expense">¥${fmt(exp)}</div></div>
    <div class="box"><div class="k">${esc(label)} 收入</div><div class="v income">¥${fmt(inc)}</div></div>`);
  w.appendChild(grid);

  // 分类占比
  const byCat = {};
  expTx.forEach(t=>{ byCat[t.cat]=(byCat[t.cat]||0)+ +t.amount; });
  const arr = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const card = el('div','card');
  card.appendChild(el('div','','<div style="font-weight:600;margin-bottom:10px">支出构成</div>'));
  if(!arr.length){
    card.appendChild(el('div','','<div style="text-align:center;color:#9CA3AF;padding:20px 0;font-size:13px">该周期没有支出</div>'));
  } else {
    const colors=['#5B6CFF','#8B5CF6','#EC4899','#F59E0B','#10B981','#06B6D4','#6366F1','#EF4444','#84CC16','#A855F7'];
    const wrap = el('div','donutwrap');
    // donut svg
    const total = exp || 1;
    let acc=0; const R=54, C=2*Math.PI*R;
    const segs = arr.slice(0,8).map(([n,v],i)=>{
      const frac=v/total; const dash=frac*C;
      const s=`<circle cx="66" cy="66" r="${R}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="22"
        stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-acc*C}" transform="rotate(-90 66 66)"/>`;
      acc+=frac; return s;
    }).join('');
    wrap.innerHTML = `<svg class="donut" viewBox="0 0 132 132">
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="#EEF0F8" stroke-width="22"/>${segs}
      <text x="66" y="62" text-anchor="middle" font-size="11" fill="#6B7280">支出</text>
      <text x="66" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">¥${fmt0(total)}</text>
    </svg>`;
    const legend = el('div','legend');
    arr.slice(0,8).forEach(([n,v],i)=>{
      const pct=(v/total*100).toFixed(1);
      legend.appendChild(el('div','lg',
        `<span class="dot" style="background:${colors[i%colors.length]}"></span><span>${esc(n)}</span>
         <span class="pct">${pct}%</span>`));
    });
    wrap.appendChild(legend);
    card.appendChild(wrap);
  }
  w.appendChild(card);

  // 趋势
  const tcard = el('div','card');
  tcard.appendChild(el('div','','<div style="font-weight:600;margin-bottom:6px">支出趋势</div>'));
  const bars = el('div','bars');
  if(S.stat.range==='year'){
    for(let i=1;i<=12;i++){
      const mm=`${y}-${String(i).padStart(2,'0')}`;
      const v=S.db.txs.filter(t=>(t.kind==='expense'||t.kind==='debt_use')&&t.date.startsWith(mm)).reduce((s,t)=>s+ +t.amount,0);
      const b=el('div','b',`<span>${i}</span>`); b.style.height='0'; b.dataset.v=v; bars.appendChild(b);
    }
  } else {
    const ym = S.stat.range==='day'? today().slice(0,7) : `${y}-${String(m).padStart(2,'0')}`;
    const days = new Date(y, S.stat.range==='day'? m : m, 0).getDate();
    for(let i=1;i<=days;i++){
      const dd=`${ym}-${String(i).padStart(2,'0')}`;
      const v=S.db.txs.filter(t=>(t.kind==='expense'||t.kind==='debt_use')&&t.date===dd).reduce((s,t)=>s+ +t.amount,0);
      const b=el('div','b',`<span>${i%5===0?i:''}</span>`); b.style.height='0'; b.dataset.v=v; bars.appendChild(b);
    }
  }
  tcard.appendChild(bars);
  w.appendChild(tcard);
  setTimeout(()=>{
    const all=[...bars.children]; const max=Math.max(...all.map(b=>+b.dataset.v||0),1);
    all.forEach(b=>{ const v=+b.dataset.v||0; b.style.height = v>0 ? Math.max(4, v/max*96)+'px' : '0px'; });
  },0);

  // 日均
  const days = S.stat.range==='day'?1:(S.stat.range==='month'? new Date(y,m,0).getDate() : 365);
  w.appendChild(el('div','statgrid',
    `<div class="box"><div class="k">日均支出</div><div class="v">¥${fmt(exp/days)}</div></div>
     <div class="box"><div class="k">结余</div><div class="v ${inc-exp>=0?'income':'expense'}">¥${fmt(inc-exp)}</div></div>`));
  return w;
}

/* ---------- 应收款 ---------- */
function editRecv(r){
  const box=el('div','sheet');
  const isNew=!r;
  const cur = r || {id:uid(), name:'', amount:0, note:'', date:today()};
  box.innerHTML=`<div class="inner">
    <h3>${isNew?'添加应收':'编辑应收'}</h3>
    <input class="inp" id="rvName" placeholder="谁欠你（如：张三）" value="${esc(cur.name)}">
    <input class="inp" id="rvAmt" inputmode="decimal" placeholder="金额" value="${(+cur.amount||0)}">
    <input class="inp" id="rvNote" placeholder="备注（可不填）" value="${esc(cur.note||'')}">
    ${isNew?`
    <div class="field" style="margin-top:6px">
      <label style="width:auto;flex:1">从账户扣（钱已经借出去了）</label>
      <input type="checkbox" id="rvFromAcc" style="width:20px;height:20px">
    </div>
    <div class="field"><label>从哪个</label>
      <select id="rvAcc">${S.db.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}（¥${fmt(a.balance)}）</option>`).join('')}</select>
    </div>
    <div class="help">勾选后：对应账户余额减少，这笔钱变成"应收"；不勾选则只是登记一笔应收，不动账户。</div>`:''}
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn ghost" id="rvCancel" style="flex:1">取消</button>
      ${isNew?'':'<button class="btn warn" id="rvDel" style="flex:1">删除</button>'}
      <button class="btn" id="rvOk" style="flex:1">保存</button>
    </div></div>`;
  $('#sheetHost').appendChild(box);
  box.onclick=e=>{ if(e.target===box) box.remove(); };
  box.querySelector('#rvCancel').onclick=()=>box.remove();
  box.querySelector('#rvOk').onclick=()=>{
    const name=(box.querySelector('#rvName').value||'').trim();
    const amt=round2(parseFloat(box.querySelector('#rvAmt').value||'0')||0);
    if(!name){ toast('请填名字'); return; }
    if(amt<=0){ toast('金额要大于 0'); return; }
    const note=(box.querySelector('#rvNote').value||'').trim();
    if(isNew){
      S.db.receivables = S.db.receivables || [];
      const cb = box.querySelector('#rvFromAcc');
      const fromAcc = !!(cb && cb.checked);
      // 勾了「从账户扣」：应收先记 0，由 lend 交易把金额加进去，避免重复计算
      S.db.receivables.push({id:cur.id, name, amount: fromAcc ? 0 : amt, note, date:today()});
      if(fromAcc){
        const acc = box.querySelector('#rvAcc').value;
        addTx({id:uid(), kind:'lend', date:today(), amount:amt, account:acc, recv:cur.id, note:name});
      } else { save(); }
    } else {
      Object.assign(r, {name, amount:amt, note});
      save();
    }
    box.remove(); render(); toast('已保存');
  };
  const del=box.querySelector('#rvDel');
  if(del) del.onclick=()=>{
    if(confirm('删除这条应收？已有收款记录不会被删除')){
      S.db.receivables = (S.db.receivables||[]).filter(x=>x.id!==r.id);
      save(); box.remove(); render();
    }
  };
}

function recvSheet(r){
  const box=el('div','sheet');
  box.innerHTML=`<div class="inner">
    <h3>${esc(r.name)} · 应收 ¥${fmt(r.amount)}</h3>
    <div class="help" style="margin-top:0">收回一笔：钱进账户，应收减少。不算收入，不影响月度收支统计。</div>
    <input class="inp" id="rqAmt" inputmode="decimal" placeholder="这次收回多少" value="${(+r.amount||0)}">
    <div class="field" style="margin-top:6px"><label>收到哪</label>
      <select id="rqAcc">${S.db.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}（¥${fmt(a.balance)}）</option>`).join('')}</select>
    </div>
    <input class="inp" id="rqNote" placeholder="备注（可不填）">
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn ghost" id="rqCancel" style="flex:1">关闭</button>
      <button class="btn" id="rqOk" style="flex:1">确认收回</button>
    </div>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn ghost" id="rqEdit" style="flex:1">编辑应收</button>
    </div></div>`;
  $('#sheetHost').appendChild(box);
  box.onclick=e=>{ if(e.target===box) box.remove(); };
  box.querySelector('#rqCancel').onclick=()=>box.remove();
  box.querySelector('#rqEdit').onclick=()=>{ box.remove(); editRecv(r); };
  box.querySelector('#rqOk').onclick=()=>{
    const amt=round2(parseFloat(box.querySelector('#rqAmt').value||'0')||0);
    if(amt<=0){ toast('金额要大于 0'); return; }
    if(amt > (+r.amount||0)+0.001 && !confirm('收回金额大于应收（¥'+fmt(r.amount)+'），继续？')) return;
    addTx({id:uid(), kind:'collect', date:today(), amount:amt,
           account:box.querySelector('#rqAcc').value, recv:r.id,
           note:(box.querySelector('#rqNote').value||'').trim()});
    box.remove(); render(); toast('已收回 ¥'+fmt(amt));
  };
}

/* ---------- 设置 ---------- */
function viewSettings(){
  const w = el('div');

  const sa = syncAlert(false);
  if(sa){
    w.appendChild(sa);
    const hide = el('div','help','');
    hide.style.cssText = 'text-align:right;margin:-6px 4px 10px;font-size:12px';
    hide.innerHTML = '<span style="color:#6B7280;text-decoration:underline;cursor:pointer">不再提醒（不推荐）</span>';
    hide.onclick = ()=>{ localStorage.setItem('jz.hideSyncTip','1'); toast('已隐藏首页提醒'); render(); };
    w.appendChild(hide);
  }

  // 云同步
  w.appendChild(el('div','sec-title','<span>云同步（跨设备）</span><span></span>'));
  const c1 = el('div','card');
  c1.innerHTML = `
    <div class="help" style="margin-top:0">用 GitHub Gist 存加密数据。数据在本地加密后才上传，云端只有密文。</div>
    <input class="inp" id="cfToken" placeholder="GitHub Token（gist 权限）" value="${esc(S.cfg.token||'')}">
    <input class="inp" id="cfGist" placeholder="Gist ID（首次留空，会自动创建）" value="${esc(S.cfg.gistId||'')}">
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn" id="cfSave" style="flex:1">保存配置</button>
      <button class="btn ghost" id="cfPush" style="flex:1">上传</button>
      <button class="btn ghost" id="cfPull" style="flex:1">拉取</button>
    </div>
    <div class="help">换手机/换电脑时：填同一个 Token 和 Gist ID，点「拉取」再输密码即可。</div>`;
  c1.querySelector('#cfSave').onclick=()=>{
    S.cfg.token=(c1.querySelector('#cfToken').value||'').trim();
    S.cfg.gistId=(c1.querySelector('#cfGist').value||'').trim();
    Store.setCfg(S.cfg); toast('已保存配置');
  };
  c1.querySelector('#cfPush').onclick=async()=>{
    try{ await Gist.push(Store.getVault()); c1.querySelector('#cfGist').value=S.cfg.gistId||''; toast('已上传'); }
    catch(e){ toast('上传失败：'+e.message); }
  };
  c1.querySelector('#cfPull').onclick=async()=>{
    try{
      const v=await Gist.pull();
      if(!v){ toast('云端没有数据'); return; }
      Store.setVault(v);
      toast('已拉取，请重新解锁');
      setTimeout(()=>location.reload(),800);
    }catch(e){ toast('拉取失败：'+e.message); }
  };
  w.appendChild(c1);

  // 数据
  w.appendChild(el('div','sec-title','<span>数据</span><span></span>'));
  const c2 = el('div','card');
  c2.innerHTML = `
    <div class="setitem" id="stExport"><span>导出备份（JSON）</span><span class="r">加密文件，可存网盘</span></div>
    <div class="setitem" id="stImport"><span>导入备份</span><span class="r">覆盖当前数据</span></div>
    <div class="setitem" id="stLock"><span>立即锁定</span><span class="r">›</span></div>
    <div class="setitem" id="stPw"><span>修改密码</span><span class="r">›</span></div>
    <div class="setitem" id="stReset" style="color:#F43F5E"><span>清空全部数据</span><span class="r">不可恢复</span></div>
    <input type="file" id="impFile" accept=".json,application/json" class="hide">`;
  c2.querySelector('#stExport').onclick=()=>{
    const v = Store.getVault();
    if(!v){ toast('没有数据'); return; }
    const blob = new Blob([JSON.stringify(v)], {type:'application/json'});
    const a = document.createElement('a');
    const d = new Date();
    const name = '记账本备份_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    toast('已导出');
  };
  c2.querySelector('#stImport').onclick=()=>c2.querySelector('#impFile').click();
  c2.querySelector('#impFile').onchange=(ev)=>{
    const f = ev.target.files && ev.target.files[0];
    if(!f) return;
    const rd = new FileReader();
    rd.onload=()=>{
      try{
        const v = JSON.parse(rd.result);
        if(!v || !v.ct || !v.salt){ toast('文件格式不对'); return; }
        if(!confirm('导入会覆盖当前本地数据，确定？')) return;
        Store.setVault(v); toast('已导入，请重新解锁'); setTimeout(()=>location.reload(), 800);
      }catch(e){ toast('读取失败'); }
    };
    rd.readAsText(f);
  };
  c2.querySelector('#stLock').onclick=()=>{ S.pw=null; S.db=null; location.reload(); };
  c2.querySelector('#stPw').onclick=()=>changePassword();
  c2.querySelector('#stReset').onclick=()=>{
    if(confirm('清空本地全部数据？云端不会自动删除') && confirm('再确认一次：所有流水、账户都会被删掉')){
      localStorage.removeItem(K_VAULT); location.reload();
    }
  };
  w.appendChild(c2);

  // 分类
  w.appendChild(el('div','sec-title','<span>分类</span><span></span>'));
  const c3 = el('div','card');
  const expList = S.db.cats.expense.map(c=>`<span style="display:inline-block;margin:4px 6px 4px 0;padding:4px 10px;background:#F5F6FB;border-radius:12px;font-size:12.5px">${c.e} ${esc(c.n)}</span>`).join('');
  c3.innerHTML = `<div style="font-size:13px;color:#6B7280;margin-bottom:6px">支出分类（${S.db.cats.expense.length}）</div>
    <div>${expList}</div>
    <button class="btn" id="addCat" style="margin-top:12px">＋ 添加支出分类</button>`;
  c3.querySelector('#addCat').onclick=()=>{
    const n=prompt('分类名称（如：加油）'); if(!n) return;
    const e=prompt('图标（emoji，可留空）','📦')||'📦';
    S.db.cats.expense.push({n:n.trim(),e:e.trim()}); save(); render(); toast('已添加');
  };
  w.appendChild(c3);

  w.appendChild(el('div','help',
    '数据保存在本机浏览器；配置了云同步后会加密上传到你的 GitHub Gist。<br>密码同时是加密钥匙，<b>忘记密码无法恢复</b>，建议记在安全的地方。'));
  return w;
}

function changePassword(){
  const np=prompt('输入新密码'); if(!np) return;
  const np2=prompt('再输入一次'); if(np!==np2){ toast('两次不一致'); return; }
  if(String(np).length<6){ toast('密码至少 6 位'); return; }
  S.pw=np; save().then(()=>toast('密码已修改'));
}

function showLock(mode){
  $('#lock').classList.remove('hide');
  $('#app').classList.add('hide');
  $('#lockTitle').textContent = mode==='new' ? '设置密码' : '记账本';
  $('#lockSub').textContent = mode==='new' ? '第一次使用，设置一个密码（同时用于加密）' : '输入密码解锁';
  $('#lockBtn').textContent = mode==='new' ? '创建' : '解锁';
  $('#pw2').classList.toggle('hide', mode!=='new');
  $('#lockTip').textContent = mode==='new' ? '密码至少 6 位，忘记无法找回' : '密码同时用于加密数据，忘了无法找回';
  $('#lock').dataset.mode = mode;
  const rl = $('#restoreLink');
  if(rl) rl.style.display = (mode==='new') ? 'block' : 'none';
  setTimeout(()=>$('#pw').focus(), 300);
}

async function restoreFromCloud(){
  const token = (prompt('粘贴 GitHub Token（ghp_ 开头）')||'').trim();
  if(!token) return;
  const gid = (prompt('粘贴 Gist ID')||'').trim();
  if(!gid) return;
  try{
    const r = await fetch('https://api.github.com/gists/'+gid,
      {headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}});
    if(!r.ok) throw new Error('拉取失败 '+r.status);
    const j = await r.json();
    const f = j.files && j.files['wallet.json'];
    if(!f) throw new Error('这个 Gist 里没有 wallet.json');
    let content = f.content;
    if(f.truncated && f.raw_url) content = await (await fetch(f.raw_url)).text();
    const v = JSON.parse(content);
    Store.setVault(v);
    const cfg = Store.getCfg(); cfg.token=token; cfg.gistId=gid; Store.setCfg(cfg);
    toast('已恢复，请用原来的密码解锁');
    setTimeout(()=>location.reload(), 900);
  }catch(e){
    alert('恢复失败：'+e.message);
  }
}

async function tryUnlock(){
  const mode = $('#lock').dataset.mode;
  const pw = $('#pw').value;
  const err = $('#lockErr');
  err.textContent='';
  if(!pw || pw.length<6){ err.textContent='密码至少 6 位'; return; }
  if(mode==='new'){
    const pw2=$('#pw2').value;
    if(pw!==pw2){ err.textContent='两次输入不一致'; return; }
    const db = defaultDB();
    S.pw=pw; S.db=db;
    Store.setVault(await seal(db,pw));
    startApp();
    return;
  }
  const vault = Store.getVault();
  if(!vault){ err.textContent='本地没有数据'; return; }
  try{
    const db = await openSeal(vault, pw);
    S.pw=pw; S.db=db; S.vault=vault;
    startApp();
  }catch(e){
    err.textContent='密码错误';
  }
}

function startApp(){
  $('#lock').classList.add('hide');
  $('#app').classList.remove('hide');
  go('home');
}

document.addEventListener('DOMContentLoaded', async ()=>{
  $('#lockBtn').onclick = tryUnlock;
  const _rl = $('#restoreLink');
  if(_rl) _rl.addEventListener('click', restoreFromCloud);
  $('#pw').addEventListener('keydown', e=>{ if(e.key==='Enter'){ if($('#lock').dataset.mode==='new') $('#pw2').focus(); else tryUnlock(); }});
  $('#pw2').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  $('#btnLock').onclick = ()=>{ if(confirm('锁定并退出？')) location.reload(); };
  $('#btnSync').onclick = async ()=>{
    if(!S.cfg.token){ toast('先去设置里配置云同步'); go('settings'); return; }
    try{ await Gist.push(Store.getVault()); toast('已同步'); }catch(e){ toast('失败：'+e.message); }
  };
  document.querySelectorAll('#nav button').forEach(b=>{ b.onclick=()=>go(b.dataset.v); });

  const vault = Store.getVault();
  showLock(vault ? 'unlock' : 'new');

  // 空闲 10 分钟自动锁定
  let idleTimer=null;
  const resetIdle=()=>{
    clearTimeout(idleTimer);
    if(!S.db) return;
    idleTimer=setTimeout(()=>{ if(S.db) location.reload(); }, 10*60*1000);
  };
  ['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev, resetIdle, {passive:true}));
});
</script>
